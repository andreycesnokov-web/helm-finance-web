name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server deps
        run: npm install --no-audit --no-fund

      - name: Server syntax check
        run: node --check server/index.js

      # A green build should mean the software works, not only that it parses.
      - name: Unit tests
        run: npm test

      # The integration suite is NOT wired in yet, and deliberately so.
      # tests/integration/telegramActorWiring.test.js fails on main today: it asserts
      # "no migration was added by PR2.5", and migrations 048-055 have legitimately
      # landed since that PR merged. The guard's premise expired rather than being
      # violated. Adding the suite now would make every build red for a reason unrelated
      # to the change under review, and a red build nobody believes is worth less than no
      # build at all. Run it locally with `npm run test:all`; wire it in once that guard
      # is either updated or retired.

      - name: Install client deps
        run: npm install --no-audit --no-fund
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
