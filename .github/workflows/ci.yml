name: CI

# Test-only opt-outs. No provider credentials or production environments are used.
env:
  DOCUMENT_OCR_NANONETS_ENABLED: 'false'
  DOCUMENT_OCR_VISION_ENABLED: 'false'

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'integration/**', 'feature/**', 'fix/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server deps
        run: npm install --no-audit --no-fund

      - name: Server syntax check
        run: node --check server/index.js

      # Financial integrity audit 2026-10-24: cash forecast, payroll dates, loan schedule and tax stages.
      - name: Cash forecast and financial integrity regressions
        run: |
          node tests/financialIntegrityAudit.test.js
          node tests/design/v2CashGapScenarios.test.mjs
          node tests/design/v2RadarSeries.test.mjs
          node tests/design/v2PulseModel.test.mjs
          node tests/design/v2Accounting.test.mjs
          node tests/businessFunding.test.js
          node tests/transactionClassifications.test.js
          node tests/classificationPrecedence.test.js
          node tests/design/v2CashClass.test.mjs
          node tests/fundingRoutesWiring.test.js

      - name: Install client deps
        run: npm install --no-audit --no-fund
        working-directory: client

      - name: Build client V2 OFF
        env:
          VITE_DESIGN_V2: 'false'
        run: npm run build
        working-directory: client

      - name: Build client V2 ON
        env:
          VITE_DESIGN_V2: 'true'
        run: npm run build
        working-directory: client

  postgres-atomic-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run PostgreSQL 2-Connection Concurrency Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresIndependentConnections.test.js

      - name: Run PostgreSQL Migration 068 Document Linking Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresBankImportBatchDocumentLinking.test.js

      - name: Run PostgreSQL Real HTTP API Bank Import Batch Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresBankImportBatchHttpApi.test.js

      - name: Verify session and revoked-token authorization guards
        run: node --test tests/sessionUser.test.js tests/revokedTokens.test.js

      - name: Run PostgreSQL Real Bank Reconciliation & Transaction Linking Flow Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresBankReconciliationFlow.test.js

      - name: Verify alternative Payroll D4 receipt contract on native PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
          CFO_PAYROLL_COMPAT_TEST: 'true'
        run: node --test tests/integration/postgresPayrollRunRaces.test.js

      - name: Verify Payroll BPJS breakdown and its rollback on native PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresPayrollBpjsBreakdown.test.js

      - name: Verify per-company P&L groups of system categories and their rollback on native PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresPnlSystemMapping.test.js

      - name: Verify operation purpose and accountant review marks and their rollback on native PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresTransactionClassifications.test.js

      - name: Verify AC-0 integrity and security hardening (grants, edit/reset audit, atomic funding, settlement, constraints) and their rollback on native PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/testdb
        run: node --test tests/integration/postgresAc0Integrity.test.js
