<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0F172A; font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;">
  <defs>
    <filter id="cfoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- WINDOW CONTAINER -->
  <rect x="10" y="10" width="1180" height="660" rx="16" fill="#FFFFFF" stroke="#334155" stroke-width="1" filter="url(#cfoShadow)"/>

  <!-- TOP HEADER -->
  <rect x="10" y="10" width="1180" height="56" rx="16" fill="#F8FAFC"/>
  <rect x="10" y="50" width="1180" height="16" fill="#F8FAFC"/>
  <line x1="10" y1="66" x2="1190" y2="66" stroke="#E2E8F0" stroke-width="1"/>

  <g transform="translate(32, 26)">
    <text x="0" y="16" font-size="14" font-weight="900" fill="#003366">AI CFO — Executive Intelligence &amp; Autonomous Audit</text>
    <text x="440" y="16" font-size="12" font-weight="500" fill="#64748B">Updated weekly • Context: Verified Ledger &amp; Bank Records</text>
  </g>

  <!-- Query Quota Pill -->
  <g transform="translate(1010, 20)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="16" y="19" font-size="11" font-weight="700" fill="#1D4ED8">284 / 300 Queries Left</text>
  </g>

  <!-- TWO TOP PANELS: WEEKLY BRIEF (LEFT) & CFO SCORE (RIGHT) -->
  <g transform="translate(32, 86)">
    
    <!-- LEFT PANEL: WEEKLY EXECUTIVE BRIEF (Width: 700) -->
    <rect x="0" y="0" width="700" height="230" rx="14" fill="#001A33" stroke="#003366" stroke-width="1"/>
    
    <g transform="translate(28, 24)">
      <rect x="0" y="0" width="130" height="22" rx="4" fill="#3399FF" fill-opacity="0.2"/>
      <text x="8" y="15" font-size="11" font-weight="800" fill="#3399FF">WEEKLY BRIEF • MAR 2026</text>

      <text x="0" y="54" font-size="20" font-weight="900" fill="#FFFFFF">Finances Are Stable With One-Off Capex Normalizing</text>
      
      <text x="0" y="86" font-size="13" font-weight="500" fill="#E2E8F0" line-height="1.6">
        <tspan x="0" dy="0">Cash runway stands at 5.4 months (162 days), well above the company target of 60 days.</tspan>
        <tspan x="0" dy="22">Operating expenses stabilized following annual cloud infrastructure and laptop purchases.</tspan>
        <tspan x="0" dy="22">Net operating margin is 28.4%. Immediate priority is following up on Rp 125M overdue</tspan>
        <tspan x="0" dy="22">receivables from enterprise retail clients before month-end tax settlement.</tspan>
      </text>

      <g transform="translate(0, 160)">
        <text x="0" y="16" font-size="12" font-weight="700" fill="#38BDF8">Explore 30-Day Cash Trajectory →</text>
      </g>
    </g>

    <!-- RIGHT PANEL: CFO HEALTH SCORE (Width: 416) -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="416" height="230" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      
      <g transform="translate(24, 20)">
        <text x="0" y="18" font-size="14" font-weight="900" fill="#003366">CFO Health Score</text>
        <rect x="290" y="2" width="76" height="22" rx="11" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="304" y="17" font-size="11" font-weight="800" fill="#065F46">HEALTHY</text>

        <!-- Big Score Number -->
        <g transform="translate(0, 36)">
          <text x="0" y="44" font-size="44" font-weight="900" fill="#003366" font-family="'JetBrains Mono', monospace">84</text>
          <text x="58" y="44" font-size="18" font-weight="700" fill="#94A3B8">/100</text>
        </g>

        <!-- Factor Progress Bars (Matching cfoModel.js: cash_health, runway, receivables, payables, expense_control) -->
        <g transform="translate(130, 42)">
          <!-- Factor 1: Cash Health -->
          <text x="0" y="10" font-size="10" font-weight="700" fill="#475569">Cash Health</text>
          <rect x="120" y="2" width="90" height="8" rx="4" fill="#E2E8F0"/>
          <rect x="120" y="2" width="81" height="8" rx="4" fill="#10B981"/>
          <text x="216" y="10" font-size="10" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">90</text>

          <!-- Factor 2: Runway -->
          <text x="0" y="28" font-size="10" font-weight="700" fill="#475569">Runway Target</text>
          <rect x="120" y="20" width="90" height="8" rx="4" fill="#E2E8F0"/>
          <rect x="120" y="20" width="79" height="8" rx="4" fill="#10B981"/>
          <text x="216" y="28" font-size="10" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">88</text>

          <!-- Factor 3: Receivables -->
          <text x="0" y="46" font-size="10" font-weight="700" fill="#475569">Receivables</text>
          <rect x="120" y="38" width="90" height="8" rx="4" fill="#E2E8F0"/>
          <rect x="120" y="38" width="67" height="8" rx="4" fill="#F59E0B"/>
          <text x="216" y="46" font-size="10" font-weight="800" fill="#B45309" font-family="'JetBrains Mono', monospace">74</text>

          <!-- Factor 4: Payables -->
          <text x="0" y="64" font-size="10" font-weight="700" fill="#475569">Payables</text>
          <rect x="120" y="56" width="90" height="8" rx="4" fill="#E2E8F0"/>
          <rect x="120" y="56" width="77" height="8" rx="4" fill="#10B981"/>
          <text x="216" y="64" font-size="10" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">86</text>

          <!-- Factor 5: Expense Control -->
          <text x="0" y="82" font-size="10" font-weight="700" fill="#475569">Expense Control</text>
          <rect x="120" y="74" width="90" height="8" rx="4" fill="#E2E8F0"/>
          <rect x="120" y="74" width="74" height="8" rx="4" fill="#10B981"/>
          <text x="216" y="82" font-size="10" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">82</text>
        </g>
      </g>
    </g>
  </g>

  <!-- LOWER SECTION: INTERACTIVE FOUNDER Q&A DEMONSTRATION -->
  <g transform="translate(32, 332)">
    <rect x="0" y="0" width="1136" height="308" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="16" font-size="14" font-weight="900" fill="#003366">Ask AI CFO — Natural Language Financial Reasoning</text>
      <text x="440" y="16" font-size="12" font-weight="500" fill="#64748B">Answers synthesized directly from double-entry ledger &amp; bank imports</text>

      <!-- Founder Question Bubble -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="620" height="44" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="16" y="27" font-size="13" font-weight="700" fill="#1E40AF">
          "Why did our operating expenses increase this month compared to January?"
        </text>
        <text x="636" y="27" font-size="12" font-weight="600" fill="#64748B">Founder • Today at 10:14 WIB</text>
      </g>

      <!-- AI CFO Response Bubble -->
      <g transform="translate(0, 94)">
        <rect x="0" y="0" width="1088" height="128" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
        <g transform="translate(20, 16)">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#003366"/>
          <text x="8" y="14" font-size="10" font-weight="800" fill="#3399FF">AI CFO</text>
          <text x="70" y="15" font-size="11" font-weight="600" fill="#64748B">Deterministic Analysis • Based on Rp 3.120M balance · 162d runway · 248 bank transactions</text>
          
          <text x="0" y="42" font-size="13" font-weight="600" fill="#1E293B" line-height="1.5">
            <tspan x="0" dy="0">Operating expenses rose by <tspan font-weight="800" fill="#991B1B">Rp 48.200.000 (+14,2%)</tspan> primarily driven by two non-recurring investments:</tspan>
            <tspan x="0" dy="19">1. <tspan font-weight="700">Annual Cloud Infrastructure Renewal</tspan> (PT Cloud Hosting Asia) — Rp 32.500.000 (Vendor Invoice #INV-8812)</tspan>
            <tspan x="0" dy="19">2. <tspan font-weight="700">Engineering Hardware Purchases</tspan> — Rp 15.700.000 across 2 approved employee payables.</tspan>
          </text>
          
          <!-- Source Citations and Verified Footnote -->
          <g transform="translate(0, 88)">
            <text x="0" y="12" font-size="11" font-weight="700" fill="#0F7A52">✓ Core recurring burn remained flat at Rp 185.000.000/month. No recurring inflation detected.</text>
            <text x="590" y="12" font-size="11" font-weight="600" fill="#64748B">Source: BCA Account #827-019-2811 • Double-entry verified</text>
          </g>
        </g>
      </g>

      <!-- Suggested Follow-Up Chips -->
      <g transform="translate(0, 226)">
        <text x="0" y="16" font-size="11" font-weight="700" fill="#64748B">SUGGESTED INQUIRIES:</text>
        
        <rect x="150" y="0" width="220" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="166" y="17" font-size="11" font-weight="600" fill="#003366">Which clients have overdue bills?</text>

        <rect x="380" y="0" width="240" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="396" y="17" font-size="11" font-weight="600" fill="#003366">Simulate hiring 3 senior engineers</text>

        <rect x="630" y="0" width="230" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="646" y="17" font-size="11" font-weight="600" fill="#003366">Calculate PPh 21 TER liability</text>
      </g>
    </g>
  </g>
</svg>
