        <text x="8" y="14" font-size="10" font-weight="800" fill="#92400E">NEXT STATUTORY DUE</text>
        <text x="0" y="44" font-size="16" font-weight="900" fill="#92400E">PPh 21 Payroll Withholding</text>
        <text x="0" y="66" font-size="11" font-weight="600" fill="#78350F">Due: 10 April 2026 • 24 Days Remaining</text>
        <text x="0" y="82" font-size="11" font-weight="800" fill="#B45309" font-family="'JetBrains Mono', monospace">Est. Liability: Rp 14.850.000 (TER Active)</text>
