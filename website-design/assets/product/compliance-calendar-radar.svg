      <text x="24" y="32" font-size="13" font-weight="700" fill="#1E293B">30 Apr 2026</text>
      <g transform="translate(140, 14)">
        <text x="0" y="16" font-size="13" font-weight="800" fill="#003366">SPT Masa PPN (Pajak Pertambahan Nilai)</text>
        <text x="0" y="32" font-size="11" font-weight="500" fill="#64748B">Keluaran vs Masukan offset • CoreTax Portal filing</text>
      </g>
      <text x="560" y="32" font-size="12" font-weight="600" fill="#334155">11% UU HPP (Net Offset)</text>
      <text x="780" y="32" font-size="13" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">Rp 32.100.000</text>
      <rect x="980" y="16" width="94" height="24" rx="6" fill="#F1F5F9"/>
      <text x="1010" y="32" font-size="11" font-weight="800" fill="#475569">PENDING</text>
      <line x1="20" y1="56" x2="1116" y2="56" stroke="#F1F5F9"/>
