        <text x="0" y="32" font-size="11" font-weight="500" fill="#64748B">Monthly employee wage withholding tax • DJP e-Bupot 21/26</text>
      </g>
      <text x="560" y="32" font-size="12" font-weight="600" fill="#334155">PP 58/2023 TER (Kat A, B, C)</text>
      <text x="780" y="32" font-size="13" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">Rp 14.850.000</text>
      <rect x="980" y="16" width="94" height="24" rx="6" fill="#DBEAFE"/>
      <text x="996" y="32" font-size="11" font-weight="800" fill="#1E40AF">CALCULATED</text>
      <line x1="20" y1="56" x2="1116" y2="56" stroke="#F1F5F9"/>
