      <text x="780" y="32" font-size="13" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">Rp 6.400.000</text>
      <rect x="980" y="16" width="94" height="24" rx="6" fill="#ECFDF5"/>
      <text x="1006" y="32" font-size="11" font-weight="800" fill="#065F46">PREPARED</text>
      <line x1="20" y1="56" x2="1116" y2="56" stroke="#F1F5F9"/>
