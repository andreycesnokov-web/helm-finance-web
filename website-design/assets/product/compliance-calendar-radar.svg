      <text x="0" y="44" font-size="16" font-weight="900" fill="#003366">DJP CoreTax Transition</text>
      <text x="0" y="66" font-size="11" font-weight="600" fill="#475569">Status: Parallel Testing &amp; XML Export Ready</text>
      <text x="0" y="82" font-size="10" font-weight="700" fill="#2563EB">Bupot Unifikasi &amp; e-Faktur 4.0 Prepared</text>
    </g>

    <!-- Card 2: Upcoming Tax Deadline -->
    <g transform="translate(385, 0)">
      <rect x="0" y="0" width="365" height="110" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
