      <text x="560" y="32" font-size="12" font-weight="600" fill="#334155">Perka BKPM No. 5/2021</text>
      <text x="780" y="32" font-size="13" font-weight="800" fill="#64748B" font-family="'JetBrains Mono', monospace">Non-Financial</text>
      <rect x="980" y="16" width="94" height="24" rx="6" fill="#FEF3C7"/>
      <text x="1006" y="32" font-size="11" font-weight="800" fill="#92400E">DUE SOON</text>
