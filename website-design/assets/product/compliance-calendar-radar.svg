    <text x="14" y="19" font-size="11" font-weight="800" fill="#065F46">Entity: PT PMA Indonesia</text>
  </g>

  <!-- TOP 3 REGULATORY METRIC CARDS -->
  <g transform="translate(32, 86)">
    
    <!-- Card 1: CoreTax Transition -->
    <rect x="0" y="0" width="365" height="110" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
