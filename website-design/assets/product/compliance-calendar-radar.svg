    <text x="490" y="16" font-size="12" font-weight="500" fill="#64748B">Active Statutes: 66 Decrees • DJP CoreTax PMK 81/2024 Schedule</text>
  </g>

  <!-- PT PMA STATUS BADGE -->
  <g transform="translate(980, 20)">
