<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0F172A; font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;">
  <defs>
    <filter id="compShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- WINDOW CONTAINER -->
  <rect x="10" y="10" width="1180" height="660" rx="16" fill="#FFFFFF" stroke="#334155" stroke-width="1" filter="url(#compShadow)"/>

  <!-- TOP HEADER -->
  <rect x="10" y="10" width="1180" height="56" rx="16" fill="#F8FAFC"/>
  <rect x="10" y="50" width="1180" height="16" fill="#F8FAFC"/>
  <line x1="10" y1="66" x2="1190" y2="66" stroke="#E2E8F0" stroke-width="1"/>

  <g transform="translate(32, 26)">
