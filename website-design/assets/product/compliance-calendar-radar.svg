    <g transform="translate(24, 340)">
      <rect x="0" y="0" width="1088" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="24" font-size="11" font-weight="800" fill="#003366">STATUTORY BOUNDARY &amp; PROFESSIONAL PREPARATION:</text>
      <text x="16" y="44" font-size="11" font-weight="500" fill="#475569">
        CFO AI automatically compiles tax calculation worksheets, verifies invoice withholding rates, and formats e-Bupot and CoreTax data. Official return submissions and regulated certifications remain the responsibility of certified Konsultan Pajak or company directors.
      </text>
    </g>
