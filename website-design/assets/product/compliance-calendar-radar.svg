    <!-- Obligation 4: BKPM LKPM Quarterly -->
    <g transform="translate(0, 234)">
      <text x="24" y="32" font-size="13" font-weight="700" fill="#1E293B">10 Apr 2026</text>
      <g transform="translate(140, 14)">
