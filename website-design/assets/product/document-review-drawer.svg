<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0F172A; font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;">
  <defs>
    <filter id="docShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- WINDOW CONTAINER -->
  <rect x="10" y="10" width="1180" height="660" rx="16" fill="#FFFFFF" stroke="#334155" stroke-width="1" filter="url(#docShadow)"/>

  <!-- TOP HEADER -->
  <rect x="10" y="10" width="1180" height="56" rx="16" fill="#F8FAFC"/>
  <rect x="10" y="50" width="1180" height="16" fill="#F8FAFC"/>
  <line x1="10" y1="66" x2="1190" y2="66" stroke="#E2E8F0" stroke-width="1"/>

  <g transform="translate(32, 26)">
    <text x="0" y="16" font-size="14" font-weight="900" fill="#003366">Document Intelligence — Extraction &amp; Reconciled Verification</text>
    <text x="490" y="16" font-size="12" font-weight="500" fill="#64748B">Intake Channel: Telegram Mobile Bot • Verified by Finance Manager</text>
  </g>

  <!-- 4-STEP WORKFLOW SEQUENCE BAR -->
  <g transform="translate(32, 86)">
    <rect x="0" y="0" width="1136" height="56" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    
    <!-- Step 1: Collect -->
    <g transform="translate(24, 14)">
      <circle cx="14" cy="14" r="14" fill="#003366"/>
      <text x="10" y="18" font-size="12" font-weight="800" fill="#FFFFFF">1</text>
      <text x="36" y="14" font-size="12" font-weight="800" fill="#003366">COLLECT</text>
      <text x="36" y="27" font-size="10" font-weight="500" fill="#64748B">Telegram / Upload</text>
    </g>
    <text x="210" y="42" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 2: Extract -->
    <g transform="translate(240, 14)">
      <circle cx="14" cy="14" r="14" fill="#003366"/>
      <text x="9" y="18" font-size="12" font-weight="800" fill="#FFFFFF">2</text>
      <text x="36" y="14" font-size="12" font-weight="800" fill="#003366">EXTRACT</text>
      <text x="36" y="27" font-size="10" font-weight="500" fill="#64748B">DPP, PPN, Vendor, Due</text>
    </g>
    <text x="460" y="42" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 3: Review (Active) -->
    <g transform="translate(490, 14)">
      <circle cx="14" cy="14" r="14" fill="#3399FF"/>
      <text x="9" y="18" font-size="12" font-weight="800" fill="#001A33">3</text>
      <text x="36" y="14" font-size="12" font-weight="800" fill="#1565C0">REVIEW &amp; MATCH</text>
      <text x="36" y="27" font-size="10" font-weight="700" fill="#1565C0">Human Verification</text>
    </g>
    <text x="730" y="42" font-size="16" fill="#94A3B8">→</text>

    <!-- Step 4: Organize -->
    <g transform="translate(760, 14)">
      <circle cx="14" cy="14" r="14" fill="#E2E8F0"/>
      <text x="9" y="18" font-size="12" font-weight="800" fill="#64748B">4</text>
      <text x="36" y="14" font-size="12" font-weight="800" fill="#64748B">ORGANIZE</text>
      <text x="36" y="27" font-size="10" font-weight="500" fill="#94A3B8">Reconciled Month-End</text>
    </g>

    <!-- Right Badge -->
    <rect x="960" y="14" width="150" height="28" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="976" y="32" font-size="11" font-weight="800" fill="#065F46">HUMAN-IN-THE-LOOP</text>
  </g>

  <!-- TWO-PANE INSPECTION INTERFACE (Left: Document Preview, Right: Review Drawer) -->
  <g transform="translate(32, 160)">
    
    <!-- LEFT PANE: INVOICE DOCUMENT PREVIEW (Width: 540, Height: 480) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="540" height="480" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
      
      <!-- Fake PDF Document Paper -->
      <g transform="translate(40, 24)">
        <rect x="0" y="0" width="460" height="432" rx="4" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#docShadow)"/>
        
        <!-- Document Content -->
        <g transform="translate(24, 24)">
          <rect x="0" y="0" width="80" height="14" rx="2" fill="#003366"/>
          <text x="0" y="34" font-size="10" font-weight="700" fill="#475569">PT MITRA TELEMATIKA INDONESIA</text>
          <text x="0" y="48" font-size="9" fill="#94A3B8">Menara BCA Lt. 32, Jakarta Pusat • NPWP: 01.442.819.2-011.000</text>
          
          <line x1="0" y1="60" x2="412" y2="60" stroke="#E2E8F0"/>
          
          <text x="0" y="80" font-size="16" font-weight="900" fill="#003366">TAX INVOICE / FAKTUR</text>
          <text x="260" y="80" font-size="10" font-weight="700" fill="#64748B">INV/2026/03/8812</text>
          
          <text x="0" y="104" font-size="10" font-weight="600" fill="#64748B">Date: 12 March 2026</text>
          <text x="260" y="104" font-size="10" font-weight="600" fill="#64748B">Due: 26 March 2026</text>

          <!-- Table of Items -->
          <rect x="0" y="120" width="412" height="24" fill="#F1F5F9"/>
          <text x="10" y="136" font-size="9" font-weight="700" fill="#475569">DESCRIPTION</text>
          <text x="240" y="136" font-size="9" font-weight="700" fill="#475569">QTY</text>
          <text x="320" y="136" font-size="9" font-weight="700" fill="#475569">AMOUNT (IDR)</text>

          <text x="10" y="162" font-size="10" font-weight="600" fill="#1E293B">Enterprise Cloud Infrastructure (12 Mos)</text>
          <text x="248" y="162" font-size="10" fill="#1E293B">1</text>
          <text x="320" y="162" font-size="10" font-weight="700" fill="#1E293B" font-family="'JetBrains Mono', monospace">42.000.000</text>
          <line x1="0" y1="176" x2="412" y2="176" stroke="#F1F5F9"/>

          <!-- Tax Calculation -->
          <g transform="translate(200, 194)">
            <text x="0" y="14" font-size="10" font-weight="600" fill="#64748B">DPP (Dasar Pengenaan Pajak):</text>
            <text x="150" y="14" font-size="10" font-weight="700" fill="#1E293B" font-family="'JetBrains Mono', monospace">Rp 42.000.000</text>

            <text x="0" y="32" font-size="10" font-weight="600" fill="#64748B">PPN 11% (Tarif Resmi):</text>
            <text x="150" y="32" font-size="10" font-weight="700" fill="#1E293B" font-family="'JetBrains Mono', monospace">Rp 4.620.000</text>

            <line x1="0" y1="42" x2="212" y2="42" stroke="#CBD5E1"/>

            <text x="0" y="60" font-size="11" font-weight="900" fill="#003366">TOTAL PAYABLE:</text>
            <text x="140" y="60" font-size="12" font-weight="900" fill="#003366" font-family="'JetBrains Mono', monospace">Rp 46.620.000</text>
          </g>

          <!-- Verified Stamp -->
          <g transform="translate(20, 230)">
            <rect x="0" y="0" width="110" height="34" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-dasharray="3,3"/>
            <text x="12" y="21" font-size="11" font-weight="900" fill="#065F46">MATCHED &amp; VERIFIED</text>
          </g>
        </g>
      </g>
    </g>

    <!-- RIGHT PANE: EXTRACTED FIELDS & RECONCILIATION MATCH DRAWER (Width: 576, Height: 480) -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="576" height="480" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="0" y="0" width="576" height="48" rx="12" fill="#FAFAFA"/>
      <line x1="0" y1="48" x2="576" y2="48" stroke="#E2E8F0"/>
      
      <text x="20" y="30" font-size="14" font-weight="800" fill="#003366">Verification Drawer</text>
      <rect x="340" y="14" width="216" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A"/>
      <text x="352" y="29" font-size="11" font-weight="700" fill="#92400E">Draft Extracted • Requires Human Review</text>

      <g transform="translate(20, 64)">
        <!-- Field 1: Vendor -->
        <text x="0" y="14" font-size="11" font-weight="700" fill="#64748B">SUPPLIER / COUNTERPARTY</text>
        <rect x="0" y="22" width="536" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="12" y="45" font-size="12" font-weight="800" fill="#003366">PT Mitra Telematika Indonesia</text>
        <text x="470" y="45" font-size="11" font-weight="700" fill="#10B981">✓ Pre-filled</text>

        <!-- Field 2: DPP and PPN -->
        <g transform="translate(0, 72)">
          <text x="0" y="14" font-size="11" font-weight="700" fill="#64748B">DPP (BASE AMOUNT)</text>
          <rect x="0" y="22" width="258" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="12" y="45" font-size="13" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">Rp 42.000.000</text>

          <text x="278" y="14" font-size="11" font-weight="700" fill="#64748B">PPN 11% (TAX EXTRACTED)</text>
          <rect x="278" y="22" width="258" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="290" y="45" font-size="13" font-weight="800" fill="#003366" font-family="'JetBrains Mono', monospace">Rp 4.620.000</text>
        </g>

        <!-- Bank Match Candidate Box -->
        <g transform="translate(0, 150)">
          <rect x="0" y="0" width="536" height="96" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
          <text x="14" y="22" font-size="11" font-weight="800" fill="#166534">MATCHED BANK TRANSACTION CANDIDATE</text>
          
          <text x="14" y="46" font-size="12" font-weight="800" fill="#14532D">BCA Giro #827-019-2811 • Trx #TX-88291</text>
          <text x="14" y="66" font-size="11" font-weight="600" fill="#15803D">Date: 12 Mar 2026 • Description: TRSF MITRA TELEMATIKA</text>
          <text x="14" y="84" font-size="11" font-weight="700" fill="#166534">Amount: Rp 46.620.000 (Exact Amount Match)</text>
          
          <rect x="430" y="52" width="90" height="28" rx="6" fill="#16A34A"/>
          <text x="444" y="70" font-size="11" font-weight="800" fill="#FFFFFF">MATCHED</text>
        </g>

        <!-- Expense Category Assignment -->
        <g transform="translate(0, 260)">
          <text x="0" y="14" font-size="11" font-weight="700" fill="#64748B">CHART OF ACCOUNTS / EXPENSE CLASSIFICATION</text>
          <rect x="0" y="22" width="536" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="12" y="45" font-size="12" font-weight="700" fill="#003366">6100-02 • IT Infrastructure, Cloud Hosting &amp; Software Licenses</text>
        </g>

        <!-- Approval Actions -->
        <g transform="translate(0, 340)">
          <rect x="0" y="0" width="360" height="42" rx="8" fill="#1565C0"/>
          <text x="64" y="26" font-size="13" font-weight="800" fill="#FFFFFF">Confirm &amp; Link to Transaction →</text>

          <rect x="376" y="0" width="160" height="42" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
          <text x="424" y="26" font-size="12" font-weight="700" fill="#475569">Reject / Flag</text>
        </g>
      </g>
    </g>
  </g>
</svg>
